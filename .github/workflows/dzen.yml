name: Статьи для Дзена
on:
  # 2 раза в день запускает внешний будильник cron-job.org (workflow_dispatch, mode=publish).
  # Готовая статья (альбом фото + текст с пометками, куда вставить фото) приходит автору в личные сообщения
  # от бота; автор публикует её в Студии Дзена.
  push:
    branches: [main]
    paths: ['dzen_post.py', 'test_dzen.py', '.github/workflows/dzen.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'find — узнать ID личного чата; preview — показать статью без отправки; publish — прислать статью автору'
        type: choice
        default: preview
        options: [find, preview, publish]
permissions:
  contents: write
concurrency:
  group: dzen-post
  cancel-in-progress: false
jobs:
  dzen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Проверить код
        run: python -m unittest test_dzen.py
      - name: Узнать ID личного чата с ботом
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'find'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python dzen_post.py --find
      - name: Показать статью без отправки
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u dzen_post.py --preview
      - name: Прислать статью автору
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DZEN_DRAFT_CHAT_ID: ${{ vars.DZEN_DRAFT_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u dzen_post.py
      - name: Сохранить историю
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          if [ -f seen_dzen.json ]; then
            git add seen_dzen.json
            if ! git diff --cached --quiet; then
              git commit -m 'Remember Dzen articles'
              for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
            fi
          fi
