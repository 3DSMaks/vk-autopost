name: Пост в ВК

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths:
      - post.py
      - test_post.py
      - requirements.txt
      - .github/workflows/post.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Проверка доступа или публикация одной новости"
        type: choice
        default: check
        options:
          - check
          - publish

permissions:
  contents: write

concurrency:
  group: vk-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверить код
        run: python -m unittest -v test_post.py
      - name: Проверить доступ к фото ВК
        if: github.event_name == 'push' || inputs.mode == 'check'
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_PHOTO_TOKEN: ${{ secrets.VK_PHOTO_TOKEN }}
        run: python post.py --check-vk
      - name: Опубликовать пост
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_PHOTO_TOKEN: ${{ secrets.VK_PHOTO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python post.py
      - name: Запомнить опубликованную новость
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "seen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
