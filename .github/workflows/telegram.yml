name: Новости в Telegram
on:
  # Запуск по расписанию — внешним будильником cron-job.org (workflow_dispatch, mode=publish):
  # встроенный schedule GitHub в этом репозитории не срабатывал.
  push:
    branches: [main]
    paths: ['telegram_post.py', 'test_telegram.py', '.github/workflows/telegram.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Проверить подключение или опубликовать новость'
        type: choice
        default: check
        options: [check, publish]
      link:
        description: 'Ссылка на статью (необязательно): пост будет именно по ней'
        required: false
        default: ''
      topic:
        description: 'Тема статьи по ссылке'
        type: choice
        default: games
        options: [games, cinema]
permissions:
  contents: write
concurrency:
  group: vk-post
  cancel-in-progress: false
jobs:
  telegram:
    if: github.event_name != 'schedule' || vars.TELEGRAM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Проверить код Telegram
        run: python -m unittest -v test_telegram.py
      - name: Проверить бота и канал
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_post.py --check
      - name: Опубликовать новость с фото
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINK: ${{ inputs.link }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$LINK" ]; then python telegram_post.py --link "$LINK" --topic "${TOPIC:-games}"; else python telegram_post.py; fi
      - name: Сохранить историю Telegram
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          if [ -f seen_telegram.json ]; then
            git add seen_telegram.json
            if ! git diff --cached --quiet; then
              git commit -m 'Remember Telegram news'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
