name: Мировые новости в ВК
on:
  # Каждые 10 минут запускает внешний будильник cron-job.org (workflow_dispatch, mode=publish).
  push:
    branches: [main]
    paths: ['world_post.py', 'test_world.py', '.github/workflows/world.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check — проверить ленты и группу; dry — показать пост без публикации; publish — опубликовать'
        type: choice
        default: check
        options: [check, dry, publish]
permissions:
  contents: write
concurrency:
  group: vk-profile
  cancel-in-progress: false
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Проверить код
        run: python -m unittest test_world.py test_vk_auth.py
      - name: Ключ профиля ВК
        if: github.event_name != 'push'
        env:
          VK_TOKEN_KEY: ${{ secrets.VK_TOKEN_KEY }}
        run: |
          git pull -q --rebase origin main
          python vk_auth.py
      - name: Сохранить обновлённый ключ (зашифрован)
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add vk_token.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Rotate VK token'
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
      - name: Проверить ленты и группу
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        env:
          WORLD_GROUP_ID: ${{ vars.WORLD_GROUP_ID }}
        run: python world_post.py --check
      - name: Показать пост без публикации
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry'
        env:
          WORLD_GROUP_ID: ${{ vars.WORLD_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python world_post.py --dry
      - name: Опубликовать подтверждённые новости
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        env:
          WORLD_GROUP_ID: ${{ vars.WORLD_GROUP_ID }}
          VK_WORLD_TOKEN: ${{ secrets.VK_WORLD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python world_post.py
      - name: Сохранить историю
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          if [ -f seen_world.json ]; then
            git add seen_world.json
            if ! git diff --cached --quiet; then
              git commit -m 'Remember world news'
              for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
            fi
          fi
